name: Iran Proxy Updater

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deps
        run: pip install httpx[socks]

      - name: Run Checker
        run: python -u checker.py

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add iran_proxies.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update proxies" && git push)
